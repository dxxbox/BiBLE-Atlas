[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-atlas"
# version = "0.1.0"
dynamic = ["version"]

description = "An Agent-native context database"
readme = "README.md"

requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.128.0",
    "httpx>=0.24.0",
    "PyYAML>=6.0",
    "uvicorn>=0.34.0",
    "types-PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "opensearch-py>=3.2.0",
    "celery[redis]>=5.3",
]

# bible_cli (Python CLI) 已废弃，入口点已移除。
# Go CLI 实现位于 bible_cli_go/，使用 `go build ./cmd/bible-cli` 构建。
# [project.scripts]
# bs = "bible_cli_DEPRECATED.python_cli:main"
# biblesearch = "bible_cli_DEPRECATED.python_cli:main"

[project.optional-dependencies]
# 向量检索功能（embedding 模型），不需要向量化时可不装
vector = [
    "sentence-transformers>=3.0",
]

# MinIO 文件系统后端
minio = [
    "minio>=7.0",
]

# AWS S3 文件系统后端
s3 = [
    "boto3>=1.26",
]

test = [
    "pytest>=8.0",
    "httpx>=0.24.0",
    "fakeredis>=2.0",
    "numpy>=1.24",
]

dev = [
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
exclude = ["third_party"]
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B006",  # Do not use mutable data structures for argument defaults
    "B904",  # Within an `except` clause, raise exceptions with `raise ... from err`
    "E741",  # Ambiguous variable name
    "E722",  # Do not use bare `except`
    "B027",  # empty method in an abstract base class
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.setuptools.packages.find]
include = ["bible*", "bible_cli_DEPRECATED*"]


[tool.setuptools_scm]
write_to = "bible/_version.py"
local_scheme = "no-local-version"
tag_regex = "^(?:v)?(?:[a-zA-Z0-9_]+@)?(?P<version>[0-9]+(?:\\.[0-9]+)*)$"
