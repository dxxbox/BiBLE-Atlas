# ============================================================
# 动态配置文件 - 支持热更新（无需重启服务）
# 修改后自动生效，或调用 reload_config() 手动刷新
# ============================================================

# ==================== 日志配置 ====================
log:
  level: DEBUG       # 日志级别：DEBUG | INFO | WARNING | ERROR | CRITICAL
                    # DEBUG 会输出每个处理步骤的详细信息，便于排查问题
                    # INFO  只输出关键节点（任务开始/结束、chunk 数量、文件写入等）
  format: "[%(asctime)s] [%(processName)s/%(threadName)s] %(levelname)s %(filename)s:%(lineno)d: %(message)s"
  output: file    # 输出目标：stdout | stderr | file（file 时日志写入 workspace_dir/log/）
  log_dir: ./workspace/log  # 日志目录；留空则默认为 <workspace_dir>/log/

# ==================== 工作区配置 ====================
# 运行时产物根目录（向量模型缓存、推理临时文件等），不含业务数据。
# 业务数据（文件落盘、任务工作区）由各 domain 的 import_memory / import_skill 独立配置。
workspace:
  root: ./workspace

# ==================== 文件系统配置 ====================
# 切换后端：将 backend 改为 minio 或 s3，并填写对应节的配置
# 安装依赖：pip install 'bible-atlas[minio]' 或 pip install 'bible-atlas[s3]'
# 注意：本地后端（local）的落盘根目录由各 domain 自己的 files_dir 指定，此处无需配置。
file_system:
  backend: local                        # 后端类型：local | minio | s3
  local:
    hash_algo: sha256                   # 摘要算法
    chunk_size: 1048576                 # 分块写入大小（字节），默认 1 MB
    use_atomic_rename: true             # 先写临时文件再原子重命名，防止并发读到半文件

  # ---- MinIO 配置（backend: minio 时生效）----
  # minio:
  #   endpoint: localhost:9000          # MinIO 服务地址（不含 http://）
  #   access_key: minioadmin            # Access Key
  #   secret_key: minioadmin            # Secret Key
  #   bucket: bible-atlas               # 目标 bucket（需提前创建）
  #   prefix: ""                        # 对象键前缀（可选），如 "bible-files"
  #   secure: false                     # true 表示使用 HTTPS
  #   region: ""                        # 区域（可选）
  #   hash_algo: sha256
  #   chunk_size: 1048576

  # ---- AWS S3 配置（backend: s3 时生效）----
  # s3:
  #   bucket: bible-atlas               # 目标 bucket
  #   prefix: ""                        # 对象键前缀（可选）
  #   region: us-east-1                 # AWS 区域
  #   endpoint_url: ""                  # 自定义端点（空 = 真实 AWS；非空 = S3-compatible 服务）
  #   access_key: ""                    # 留空则使用 IAM Role / 环境变量 AWS_ACCESS_KEY_ID
  #   secret_key: ""
  #   hash_algo: sha256
  #   chunk_size: 1048576

# ==================== 数据库配置 ====================
# 切换后端：将 backend 改为 elasticsearch 或 postgres，并填写对应节的配置
database:
  backend: opensearch   # 后端类型：opensearch | elasticsearch | postgres

  # ---- OpenSearch 配置（backend: opensearch 时生效）----
  opensearch:
    hosts:
      - "localhost:9800"
    timeout_seconds: 30
    use_ssl: false
    verify_certs: true
    username: opensearch-xo
    password: MyStr0ng!Pass#2024
    binding_index: v4_index_binding
    async_task_index: v4_async_tasks
    refresh_policy: "false"
    bulk_chunk_size: 500
    request_timeout_seconds: 60

  # ---- Elasticsearch 配置（backend: elasticsearch 时生效）----
  # elasticsearch:
  #   hosts:
  #     - "localhost:9200"
  #   timeout_seconds: 30
  #   use_ssl: false
  #   verify_certs: true
  #   username: ""
  #   password: ""
  #   binding_index: v4_index_binding
  #   async_task_index: v4_async_tasks
  #   refresh_policy: "false"
  #   bulk_chunk_size: 500
  #   request_timeout_seconds: 60

  # ---- PostgreSQL 配置（backend: postgres 时生效）----
  # postgres:
  #   dsn: "postgresql://user:password@localhost:5432/bible"
  #   pool_min_size: 1
  #   pool_max_size: 10
  #   pool_timeout_seconds: 30
  #   binding_table: v4_index_binding
  #   content_table: v4_content_docs
  #   file_registry_table: v4_file_registry
  #   async_task_table: v4_async_tasks
  #   bulk_chunk_size: 500

# ==================== Celery 异步任务队列配置 ====================
celery:
  broker_url: "redis://localhost:9880/0"
  result_backend: "redis://localhost:9880/1"
  worker_concurrency: 4          # worker 子进程数，0 表示使用 CPU 核心数

# ==================== Memory Import 配置 ====================
import_memory:
  parsers_dir: ./bible/features/upload/memory_upload/parsers  # 预注册脚本目录（parse_memory.py / parse_default.py）
  custom_parsers_dir: ./bible/features/upload/memory_upload/parsers/custom  # 上传脚本通过校验并导入成功后覆盖保存为 parse_memory.py
  import_work_dir: ./workspace/memory/import_work             # 任务工作区根目录：API 上传暂存、解析器脚本暂存、任务产物均存于此
  files_dir: ./workspace/memory/files                         # 文件永久落盘根目录（MEMORY/<kb_index>/<date>/）
  keep_failed_workspace: true            # 是否保留失败的任务工作区，true 表示保留，false 表示删除
  task_timeout_seconds: 300              # 单个 import 任务整体超时（秒），0 表示不限
  sandbox_timeout_seconds: 60            # 解析脚本子进程超时（秒）
  workspace_ttl_hours: 24                # 任务工作区保留时长（小时），0 表示不自动清理
  sweep_interval_seconds: 3600           # TTL 扫描周期（秒），默认 1 小时

# ==================== Skill Import 配置 ====================
import_skill:
  parsers_dir: ./bible/features/upload/skill_upload/parsers   # 预注册脚本目录
  custom_parsers_dir: ./bible/features/upload/skill_upload/parsers/custom  # 上传脚本通过校验并导入成功后覆盖保存为 parse_skill.py
  import_work_dir: ./workspace/skill/import_work              # 任务工作区根目录（临时，可清理）
  files_dir: ./workspace/skill/files                          # 文件永久落盘根目录（<date>/<task_id>/）
  keep_failed_workspace: true            # 是否保留失败的任务工作区
  task_timeout_seconds: 300
  sandbox_timeout_seconds: 60
  workspace_ttl_hours: 24
  sweep_interval_seconds: 3600
  allowed_extensions:
    - .skill
    - .md
    - .json
    - .png
    - .jpg
    - .jpeg
    - .pdf
    - .txt
    - .yaml
    - .yml
    - .sh
    - .py

# ==================== 库配置 ====================
# 测试库列表（包含所有可用库）
test_libraries:
  - sct_testcase
  - sct_function
  - coding_standards
  - build_method
  - requirement
  - algorithm
  - design
  - flow
  - build
  - spec
  - syntax

# ==================== 检索标签配置 ====================
# 检索标签到索引的映射（用于API检索路由）
tag_to_index_mapping:
  CODE: null  # null表示使用请求中的index_name
  SCT: sct_testcase
  BUILD: build_method
  SYNTAX: coding_standards
  SPEC: requirement
  ALG: algorithm
  DESIGN: design
  FLOW: flow

# 支持的检索标签列表
supported_search_tags:
  - CODE
  - SCT
  - BUILD
  - SYNTAX
  - SPEC
  - ALG
  - DESIGN
  - FLOW

# SCT 库列表（用于判断是否使用SCT特殊逻辑）
sct_libraries:
  - sct_testcase
  - sct_function

# SCT 检索前缀标识
sct_prefix: "[SCT]"

# ==================== 编码规范配置 ====================
# 编码规范语言映射（章节标题关键字 -> 语言标识）
coding_standards_languages:
  c++: cpp
  cpp: cpp
  ttcn-3: ttcn3
  ttcn3: ttcn3
  python: python
  rust: rust
  java: java
  go: go
  javascript: javascript
  typescript: typescript

# 检索库到编码规范语言的映射
library_to_coding_language:
  sct_testcase: ttcn3
  sct_function: ttcn3
  # 其他库默认使用 default_coding_language

# 默认编码规范语言（当库不在映射中时）
default_coding_language: cpp

# ==================== 文件上传限制 ====================
upload:
  # 单个文件最大大小（字节）
  max_file_size: 10485760      # 10 MB

  # 单次上传总大小上限（字节）
  max_total_size: 209715200    # 200 MB

  # 单次上传最大文件数
  max_file_count: 2000

  # 允许的文件扩展名
  allowed_extensions:
    - .md
    - .json

# ==================== 检索配置 ====================
search:
  default_top_k: 10
  max_top_k: 100
  allowed_search_types:
    - keyword
    - title
    - text
    - vector
    - hybrid

# 默认检索结果数量
default_top_k: 10

# 最大检索结果数量
max_top_k: 100

# 结果筛选方式
# 可选值: none, elbow, gap_statistic
# - none: 不进行筛选，返回所有结果
# - elbow: 使用Elbow Method识别断崖式差距
# - gap_statistic: 使用Gap Statistic识别最大间隙
result_filter_mode: none

# 筛选参数
filter_min_results: 3   # 筛选后至少保留的结果数
filter_max_results: 10  # 筛选后最多保留的结果数

# ==================== 关联函数查询配置 ====================
# 是否启用关联函数查询
enable_relation_search: true

# 最大递归深度（0=不查关联，1=查1层，2=查2层...）
# 深度定义：深度0是主检索结果，深度1是第一层关联，深度2是第二层关联
max_relation_depth: 2

# ==================== API默认参数 ====================
# 默认检索类型
api_default_search_type: hybrid

# 默认向量模型
api_default_vector_model: bge-large

# 默认向量权重（混合检索）
api_default_vector_weight: 0.8

# 默认过滤模式
api_default_filter_mode: none

# 默认启用关联查询
api_default_enable_relation: true

# 是否在响应中附加额外内容（编码规范和编译方法）
# true: 根据tag判断是否附加; false: 不附加
enable_append_extra_content: false

# 允许的CORS来源（"*"表示所有）
cors_origins: "*"

# ==================== AI增强检索配置 ====================
# 是否启用AI模型增强检索（默认false）
ai_enable: false

# AI检索时top_k扩展系数
# 当启用AI筛选时，初始检索数量 = 用户请求的top_k × ai_top_k_multiplier
# 例如：用户要10条，系数为3，则先检索30条，再用AI筛选出最佳10条
ai_top_k_multiplier: 6

# AI筛选超时时间（秒）
# 注意：考虑到代理服务器超时限制，建议设置为60秒以内
# 如果AI处理时间超过此值，将返回原始检索结果
ai_filter_timeout: 120

# Copilot CLI配置（用于AI调用）
copilot_config:
  cli_path: "/home/fenghxu/.nvm/versions/node/v22.22.0/bin/copilot"  # Copilot CLI完整路径（参照auto_doc/configs/config.yaml）
  # 可用的AI模型列表
  available_models:
    - "gpt-4.1"
    - "gpt-5-mini"
    - "gpt-5.1"
    - "gpt-5.1-codex"
    - "gpt-5.2"
    - "gpt-5.2-codex"
    - "gpt-5.3-codex"
    - "gpt-5.4"
    - "claude-sonnet-4.5"
    - "claude-sonnet-4.6"
  # 默认模型（API请求未指定时使用）
  default_model: "gpt-5-mini"
  workspace_root: "/var/fpwork2/fenghxu/cprt_ai_context/elastic_operator/website_9220/"  # 工作空间绝对路径

# ==================== Rerank（重排序）配置 ====================
# 是否启用 Rerank（默认false，用于对比评估效果）
rerank:
  enable: true
  preload_on_startup: true   # 启动时预加载 rerank 模型到内存（与 vector.preload_on_startup 同步）

  # HuggingFace 缓存目录（与向量模型共用同一目录）
  hf_cache_dir: ./workspace/hf_cache

  # 默认使用的 rerank 模型
  default_model: 'bge-reranker-base'
  
  # Rerank检索时top_k扩展系数
  # 当启用Rerank时，初始检索数量 = 用户请求的top_k × rerank_top_k_multiplier
  # 例如：用户要10条，系数为3，则先检索30条，再用Rerank重排序后选择最佳10条
  top_k_multiplier: 6
  
  # 可用的 rerank 模型列表（优先级从高到低）
  available_models:
    # 中文场景首选
    - id: 'bge-reranker-base'
      name: 'BAAI/bge-reranker-base'
      description: '中文优化，性价比最高（推荐）'
      params: '278M'
      languages: ['中文', '英文']
      speed: '~200 对/秒'
      
    - id: 'bge-reranker-large'
      name: 'BAAI/bge-reranker-large'
      description: '中文最高精度'
      params: '326M'
      languages: ['中文', '英文']
      speed: '~100 对/秒'
      
    - id: 'bge-reranker-v2-m3'
      name: 'BAAI/bge-reranker-v2-m3'
      description: '多语言，支持超长文本（8K tokens）'
      params: '568M'
      languages: ['100+ 语言']
      speed: '~50 对/秒'
    
    # 英文场景备选
    - id: 'ms-marco-MiniLM'
      name: 'cross-encoder/ms-marco-MiniLM-L-6-v2'
      description: '轻量快速，英文为主'
      params: '23M'
      languages: ['英文']
      speed: '~800 对/秒'
      
    - id: 'ms-marco-electra-base'
      name: 'cross-encoder/ms-marco-electra-base'
      description: '英文场景，速度与精度平衡'
      params: '110M'
      languages: ['英文']
      speed: '~150 对/秒'
    
# ==================== 向量模型配置 ====================
# name 为 HuggingFace / sentence-transformers 模型 id（启动预加载与 ensure_model_ready 使用）。
vector:
  # 是否在启动时预加载所有模型（预加载列表为各条目的 name）
  preload_on_startup: true

  # HuggingFace 缓存目录（模型权重，体积较大，独立于业务数据目录）
  hf_cache_dir: ./workspace/hf_cache

  # 向量编码批大小（与 embedding 侧预留/对齐，当前实现未强制使用）
  batch_size: 32

  # 可用的向量模型列表
  available_models:
    - id: 'mini'
      name: 'paraphrase-multilingual-MiniLM-L12-v2'
      description: '多语言，轻量快速'
      params: '118M'
      dims: 384
      languages: ['多语言']

    - id: 'mpnet'
      name: 'paraphrase-multilingual-mpnet-base-v2'
      description: '多语言，平衡性好'
      params: '278M'
      dims: 768
      languages: ['多语言']

    - id: 'bge-base'
      name: 'BAAI/bge-base-zh-v1.5'
      description: '中文优化，基础版'
      params: '102M'
      dims: 768
      languages: ['中文', '英文']

    - id: 'bge-large'
      name: 'BAAI/bge-large-zh-v1.5'
      description: '中文优化，高精度'
      params: '326M'
      dims: 1024
      languages: ['中文', '英文']

    - id: 'bge-m3'
      name: 'BAAI/bge-m3'
      description: '多语言，支持长文本'
      params: '568M'
      dims: 1024
      languages: ['100+ 语言']

    - id: 'e5-large'
      name: 'intfloat/multilingual-e5-large'
      description: '多语言，高性能'
      params: '560M'
      dims: 1024
      languages: ['多语言']
