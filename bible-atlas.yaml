# ============================================================
# 动态配置文件 - 支持热更新（无需重启服务）
# 修改后自动生效，或调用 reload_config() 手动刷新
# ============================================================

log:
  level: DEBUG    # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: "[%(asctime)s] [%(processName)s/%(threadName)s] %(levelname)s %(filename)s:%(lineno)s: %(message)s"
  ouktput: file
  log_dir: ./workspace/log

storage:
  workspace_dir: ./workspace/memory   #root folder for data persist, files/import_work are all created within.

file_system:
  backend: local    #backend type: local | minio | s3
  local:
    root_dir: ./workspace/memory/files
    hash_algo: sha256
    chunk_size: 1048576
    use_atomic_rename: true

#------ MinIO configure while minio enabled
#
#minio:
#  endpoint: localhost:9000
#  access_key: minioadmin
#  secret_key: minioadmin
#  bucket: bible-atlas
#  prefix: ""
#  secure: false
#  region: ""
#  hash_algo: sha256
#  chunk_size: 1048576


#--------- AWS S3 configure while S3 enabled
#
#s3:
#  bucket: bible-atlas
#  prefix: ""
#  region: us-east-1
#  endpoint_url: ""
#  access_key: ""
#  secret_key: ""
