name: bible-hermes-plugin
version: 0.1.0
description: BiBLE Atlas — memory recall, session capture, knowledge/skill tools, and CLI for Hermes Agent.
author: BiBLE Atlas Team
provides_tools:
  - bible_memory_search
  - bible_memory_save
  - bible_memory_get
  - bible_knowledge_search
  - bible_knowledge_list
  - bible_skill_search
  - bible_skill_get
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - on_session_start
  - on_session_end
  - on_session_reset
requires_env:
  - name: BIBLE_ATLAS_BASE_URL
    description: "BiBLE Atlas HTTP service base URL (e.g. http://localhost:5555)"
    secret: false
  - name: BIBLE_ATLAS_TOKEN
    description: "Optional bearer token for authenticated BiBLE Atlas deployments"
    secret: true

# ── config schema ────────────────────────────────────────────────────────────
# All fields below can be set in ~/.hermes/config.yaml under a `bible:` key.
# Environment variables BIBLE_ATLAS_BASE_URL and BIBLE_ATLAS_TOKEN take
# precedence over config.yaml values.
#
# config_schema matches the OpenClaw plugin's configSchema for compatibility.
config_schema:
  type: object
  additionalProperties: false
  properties:
    base_url:
      type: string
      description: "BiBLE Atlas HTTP service base URL"
    token:
      type: string
      description: "Optional bearer token"
    timeout_ms:
      type: integer
      minimum: 1000
      default: 30000
    context_engine_id:
      type: string
      default: "bible-hermes-plugin"
    default_kb_index:
      type: string
      default: "kb_memory_main"
    source_client:
      type: string
      default: "hermes"
    enable_memory_recall:
      type: boolean
      default: true
    enable_skill_recall:
      type: boolean
      default: false
    enable_knowledge_recall:
      type: boolean
      default: false
    knowledge_tags:
      type: array
      items:
        type: string
      default: []
    recall_top_k:
      type: integer
      minimum: 1
      maximum: 50
      default: 8
    recall_min_score:
      type: number
      minimum: 0
      maximum: 1
      default: 0.35
    injection_token_budget:
      type: integer
      minimum: 128
      default: 1200
    capture_enabled:
      type: boolean
      default: true
    capture_commit_threshold_turns:
      type: integer
      minimum: 1
      default: 8
    capture_commit_threshold_chars:
      type: integer
      minimum: 1000
      default: 16000
    force_injection:
      type: boolean
      default: false
      description: "When true, run BiBLE Atlas recall pipeline on every user message before LLM processing, regardless of enable_*_recall flags."
    force_capture:
      type: boolean
      default: false
      description: "When true, immediately async-flush every captured turn to BiBLE Atlas instead of waiting for threshold-based batching. capture_enabled must still be true."
    bypass_session_patterns:
      type: array
      items:
        type: string
      default: []
      description: "Regex patterns — matching session IDs skip recall and capture"
