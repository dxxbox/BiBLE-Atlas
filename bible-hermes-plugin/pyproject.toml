[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bible-hermes-plugin"
version = "0.1.0"
description = "BiBLE Atlas — memory recall, session capture, knowledge/skill tools, and CLI for Hermes Agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.entry-points."hermes_agent.plugins"]
# Enables auto-discovery by Hermes when installed as a pip package:
#   pip install bible-hermes-plugin  (or: uv pip install .)
# Hermes will call register(ctx) from the bible_hermes_plugin module.
bible-hermes-plugin = "bible_hermes_plugin"

[tool.hatch.build.targets.wheel]
# Package all Python source from the plugin directory as bible_hermes_plugin.
# The directory itself is the package — no separate src/ layout needed for a
# Hermes directory plugin that also supports pip-based distribution.
packages = ["bible_hermes_plugin"]

[tool.uv]
# Managed by uv. Run `uv sync` inside this directory to install dependencies.

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["bible_hermes_plugin"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names, …)
    "I",    # isort (import order)
    "UP",   # pyupgrade (modernise syntax)
    "B",    # flake8-bugbear (likely bugs / design issues)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking (move pure-annotation imports to TYPE_CHECKING)
    "RUF",  # ruff-native rules
    "PTH",  # flake8-pathlib (prefer pathlib over os.path)
    "PIE",  # flake8-pie (misc. lints)
    "TID",  # flake8-tidy-imports
    "PLC",  # pylint convention
    "PLE",  # pylint error
    "PLW",  # pylint warning
]
ignore = [
    "E501",    # line length (handled by formatter)
    "B008",    # do not perform function calls in default arguments
    "SIM108",  # ternary operator (readability preference)
    "PLW2901", # loop variable override (common in generators)
    "UP007",   # use X | Y for union types — keep Optional for py3.10 compat
    "TID252",  # relative imports from parent modules are idiomatic in packages
    "TC001",   # moving app imports to TYPE_CHECKING is optional for a plugin
    "TC002",   # same for 3rd-party imports
    "TC003",   # same for stdlib imports
    "PLC0415", # conditional / lazy imports (yaml, datetime) are intentional here
]

[tool.ruff.lint.isort]
known-first-party = ["bible_hermes_plugin"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── basedpyright ──────────────────────────────────────────────────────────────
[tool.basedpyright]
pythonVersion = "3.10"
pythonPlatform = "Linux"
include = ["bible_hermes_plugin"]
# The Hermes ctx object has no stubs; suppress noise from external unknowns
# while keeping our own code strictly checked.
typeCheckingMode = "standard"
reportMissingModuleSource = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportAny = false
reportIgnoreCommentWithoutRule = false
