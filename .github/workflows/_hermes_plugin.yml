name: 16. _Hermes Plugin Checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  hermes-plugin-lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Ruff check
      working-directory: bible-hermes-plugin
      run: uv run ruff check bible_hermes_plugin/

    - name: Basedpyright typecheck
      working-directory: bible-hermes-plugin
      run: uv run basedpyright bible_hermes_plugin/

  hermes-plugin-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Run tests
      working-directory: bible-hermes-plugin
      run: python -m pytest tests/ -v
