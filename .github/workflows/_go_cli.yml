name: 13. _Go CLI Checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  go-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: bible_cli_go/go.mod
        cache-dependency-path: bible_cli_go/go.mod

    - name: Run go vet
      working-directory: bible_cli_go
      run: |
        go vet ./...

    - name: Run staticcheck (if available)
      working-directory: bible_cli_go
      run: |
        if command -v staticcheck >/dev/null 2>&1; then
          staticcheck ./...
        else
          echo "staticcheck not available; skipping"
        fi

    - name: Run Go tests
      working-directory: bible_cli_go
      run: |
        go test ./...

    - name: Run contract regression
      working-directory: bible_cli_go
      run: |
        set -euo pipefail
        mkdir -p ../.ci-artifacts/contract

        go test ./internal/cli -run 'TestRunGoldenScenarios|TestRunUnknownCommand|TestRunSkillsListNotImplemented' -v | tee ../.ci-artifacts/contract/cli-contract.txt
        go test ./internal/client/http -run 'TestErrorEnvelopeMapsToCLIError|TestErrorEnvelopeFor501ForcesSEVNotImplemented|TestTimeoutCompatibilityCodeNormalization|TestHTTPTransportTimeoutMapsToTimeout' -v | tee ../.ci-artifacts/contract/http-contract.txt
        go test ./internal/config -run 'TestLoadResolvedConfigDefaults|TestLoadResolvedConfigPrioritySystemUserEnv|TestLoadResolvedConfigUsesAtlasFallback|TestLoadResolvedConfigInvalidValuesFallback' -v | tee ../.ci-artifacts/contract/config-contract.txt

    - name: Upload contract regression reports
      uses: actions/upload-artifact@v4
      with:
        name: go-cli-contract-report
        path: .ci-artifacts/contract/
        if-no-files-found: error

  go-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: bible_linux_amd64
            legacy_output: bible-cli-go_linux_amd64
            package_suffix: linux_amd64
          - goos: darwin
            goarch: arm64
            output: bible_darwin_arm64
            legacy_output: bible-cli-go_darwin_arm64
            package_suffix: darwin_arm64
          - goos: windows
            goarch: amd64
            output: bible_windows_amd64.exe
            legacy_output: bible-cli-go_windows_amd64.exe
            package_suffix: windows_amd64
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: bible_cli_go/go.mod
        cache-dependency-path: bible_cli_go/go.mod

    - name: Resolve build version
      id: version
      run: |
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          VERSION="${GITHUB_REF_NAME}"
        else
          VERSION="dev-${GITHUB_SHA::7}"
        fi
        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

    - name: Build binary
      working-directory: bible_cli_go
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p dist
        go build -buildvcs=false -trimpath -ldflags="-s -w" -o "dist/${{ matrix.output }}" ./cmd/bible-cli
        cp -f "dist/${{ matrix.output }}" "dist/${{ matrix.legacy_output }}"

    - name: Package versioned archive
      id: package
      working-directory: bible_cli_go
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        SUFFIX="${{ matrix.package_suffix }}"
        mkdir -p dist/packages
        if [[ "${{ matrix.goos }}" == "windows" ]]; then
          PACKAGE_FILE="bible_${VERSION}_${SUFFIX}.zip"
          zip -q -j "dist/packages/${PACKAGE_FILE}" "dist/${{ matrix.output }}"
        else
          PACKAGE_FILE="bible_${VERSION}_${SUFFIX}.tar.gz"
          tar -C dist -czf "dist/packages/${PACKAGE_FILE}" "${{ matrix.output }}"
        fi
        echo "file=${PACKAGE_FILE}" >> "${GITHUB_OUTPUT}"

    - name: Upload primary artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output }}
        path: bible_cli_go/dist/${{ matrix.output }}

    - name: Upload legacy-compatible artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.legacy_output }}
        path: bible_cli_go/dist/${{ matrix.legacy_output }}

    - name: Upload versioned package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.package.outputs.file }}
        path: bible_cli_go/dist/packages/${{ steps.package.outputs.file }}
