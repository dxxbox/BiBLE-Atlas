name: 11. _Lint Checks

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Required to calculate the git diff
        
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --all-extras

    # --- NEW STEP: Get the list of changed files ---
    - name: Get changed files
      id: files
      run: |
        # Determine the base commit for comparison
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          # For PRs, compare PR head to base branch
          BASE_COMMIT="origin/${{ github.base_ref }}"
        else
          # For direct pushes, compare to the previous commit
          BASE_COMMIT="${{ github.event.before }}"
          # If this is the first commit, use HEAD~1 as fallback
          if [ "$BASE_COMMIT" == "0000000000000000000000000000000000000000" ]; then
            BASE_COMMIT="HEAD~1"
          fi
        fi
        echo "changed_files=$(git diff --name-only --diff-filter=d $BASE_COMMIT HEAD | grep '\.py$' | xargs)" >> $GITHUB_OUTPUT

    # --- UPDATED STEPS: Use the file list ---
    - name: List files
      run: echo "The changed files are ${{ steps.files.outputs.changed_files }}"

    - name: Lint with ruff (Changed files only)
      if: steps.files.outputs.changed_files != ''
      run: uv run ruff format --check ${{ steps.files.outputs.changed_files }}
      continue-on-error: true

    - name: Format with ruff (Changed files only)
      if: steps.files.outputs.changed_files != ''
      run: uv run ruff check ${{ steps.files.outputs.changed_files }}
      continue-on-error: true  

    - name: Type check with mypy (Changed files only)
      if: steps.files.outputs.changed_files != ''
      # Note: Running mypy on specific files may miss cross-file type errors
      run: uv run mypy ${{ steps.files.outputs.changed_files }}
      continue-on-error: true
