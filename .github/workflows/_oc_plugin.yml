name: 14. _OpenClaw Plugin Checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  oc-plugin-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: bible-oc-plugin/package-lock.json

    - name: Install dependencies
      working-directory: bible-oc-plugin
      run: npm ci

    - name: Type check
      working-directory: bible-oc-plugin
      run: npm run typecheck

    - name: Run tests
      working-directory: bible-oc-plugin
      run: npm test

    - name: Build
      working-directory: bible-oc-plugin
      run: npm run build
